services:
  - type: web
    name: backend
    runtime: docker
    repo: https://github.com/dhruvsingh895/RideFlow
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: frontend
    runtime: docker
    repo: https://github.com/dhruvsingh895/RideFlow
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        fromService:
          name: backend
          type: web
          property: hostport

  - type: keyvalue
    name: redis
    plan: free
    ipAllowList: []

databases:
  - name: postgres
    plan: free
