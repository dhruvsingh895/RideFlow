<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RideFlow — a modern ride-hailing platform running entirely on your machine with Docker."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RideFlow — Local Ride Hailing</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("rf_theme");
          if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
